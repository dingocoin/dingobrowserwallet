name: Release

# Run from the Actions tab on master after the version in package.json and
# source/manifest.json has been bumped. Creates a draft GitHub Release; the tag
# v<version> is created when the draft is published.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the version has not been released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. Bump the version in package.json and source/manifest.json."
            exit 1
          fi
          # Fetch first so an API error fails the job instead of passing the check.
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qx "v$version" <<< "$releases"; then
            echo "::error::A release or draft for v$version already exists. Publish or delete it, or bump the version."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:chrome
      - run: npm run build:firefox

      # The Firefox xpi is submitted to AMO, so hold the release to the same
      # bar Mozilla applies.
      - run: npm run lint:firefox

      - id: package
        run: npm run package:release

      # AMO requires the sources for every version, because the add-on ships
      # bundled and minified code. Building the archive here keeps it matched
      # to the released commit: `npm run package:source` archives HEAD.
      - id: source
        run: npm run package:source

      - name: Collect the Firefox files
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
        run: |
          xpi="dingocoin-wallet-$VERSION-firefox.xpi"
          cp extension/firefox.xpi "extension/release/$xpi"
          cp "extension/source/$SOURCE_ZIP" "extension/release/$SOURCE_ZIP"
          cd extension/release
          sha256sum "$xpi" "$SOURCE_ZIP" >> SHA256SUMS
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
        id: firefox

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          CHROME_ZIP: ${{ steps.package.outputs.chrome_zip }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          XPI: ${{ steps.firefox.outputs.xpi }}
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          cat > release-notes.md <<EOF
          ## Install

          **Chrome Web Store:** upload \`$CHROME_ZIP\` in the developer dashboard.

          **Manually:** download \`$CHROME_ZIP\`, open \`chrome://extensions\`, turn on **Developer mode** and drag the zip onto the page.

          SHA-256 of \`$CHROME_ZIP\`: \`$SHA256\` (also in \`SHA256SUMS\`; check with \`sha256sum -c SHA256SUMS\`).

          ## Firefox (addons.mozilla.org)

          Upload \`$XPI\` as a new version, and attach \`$SOURCE_ZIP\` in the
          **source code** field: AMO requires the sources because the add-on ships
          bundled and minified code. Paste the text from
          \`.github/AMO_REVIEWER_NOTES.md\` into **Notes to Reviewers**.

          \`$SOURCE_ZIP\` archives this commit, so \`npm ci && npm run build:firefox\`
          reproduces every file inside \`$XPI\` byte for byte. Compare the contents,
          not the xpi's own checksum: the zip container records timestamps, so it
          differs between builds even when the code is identical.

          SHA-256 of \`$SOURCE_ZIP\`: \`$SOURCE_SHA256\`.

          The xpi is unsigned, so it installs only as a temporary add-on until
          Mozilla signs it.
          EOF
          url=$(gh release create "v$VERSION" \
            "extension/release/$CHROME_ZIP" \
            "extension/release/$XPI" \
            "extension/release/$SOURCE_ZIP" \
            extension/release/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Dingocoin Wallet $VERSION" \
            --notes "$(cat release-notes.md)" \
            --generate-notes)
          {
            echo "## Draft release v$VERSION"
            echo ""
            echo "[$url]($url): review the notes, then **Publish release** to create the tag."
          } >> "$GITHUB_STEP_SUMMARY"
