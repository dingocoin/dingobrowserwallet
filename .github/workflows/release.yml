name: Release

# Run from the Actions tab on master after the version in package.json and
# source/manifest.json has been bumped. Creates a draft GitHub Release; the tag
# v<version> is created when the draft is published.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the version has not been released, and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Fail here rather than after the build: both checks take a second.
          notes="doc/release-notes/release-notes-$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty. Move doc/release-notes.md there and describe what changed for users."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. Bump the version in package.json and source/manifest.json."
            exit 1
          fi
          # Fetch first so an API error fails the job instead of passing the check.
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qx "v$version" <<< "$releases"; then
            echo "::error::A release or draft for v$version already exists. Publish or delete it, or bump the version."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:chrome
      - run: npm run build:firefox

      # The Firefox xpi is submitted to AMO, so hold the release to the same
      # bar Mozilla applies.
      - run: npm run lint:firefox

      - id: package
        run: npm run package:release

      # AMO requires the sources for every version, because the add-on ships
      # bundled and minified code. Building the archive here keeps it matched
      # to the released commit: `npm run package:source` archives HEAD.
      - id: source
        run: npm run package:source

      - name: Collect the Firefox files
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
        run: |
          xpi="dingocoin-wallet-$VERSION-firefox.xpi"
          cp extension/firefox.xpi "extension/release/$xpi"
          cp "extension/source/$SOURCE_ZIP" "extension/release/$SOURCE_ZIP"
          cd extension/release
          sha256sum "$xpi" "$SOURCE_ZIP" >> SHA256SUMS
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
        id: firefox

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          CHROME_ZIP: ${{ steps.package.outputs.chrome_zip }}
          XPI: ${{ steps.firefox.outputs.xpi }}
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          # The release page is for users: the hand-written notes from the
          # repository, how to install, and how to verify. Maintainer steps go to
          # the job summary instead, where users never see them. No
          # --generate-notes: the notes are written by hand and reviewed.
          {
            cat "doc/release-notes/release-notes-$VERSION.md"
            echo
            echo "## Install"
            echo
            echo "**Chrome:** download \`$CHROME_ZIP\`, open \`chrome://extensions\`, turn on **Developer mode**, and drag the zip onto the page."
            echo
            echo "**Firefox:** install from [addons.mozilla.org](https://addons.mozilla.org/addon/dingocoin-wallet/) once Mozilla has signed this version. The attached \`$XPI\` is unsigned, so it loads only as a temporary add-on."
            echo
            echo "## Verify"
            echo
            echo '```'
            cat extension/release/SHA256SUMS
            echo '```'
            echo
            echo "Check with \`sha256sum -c SHA256SUMS\`."
          } > release-body.md
          url=$(gh release create "v$VERSION" \
            "extension/release/$CHROME_ZIP" \
            "extension/release/$XPI" \
            "extension/release/$SOURCE_ZIP" \
            extension/release/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Dingocoin Wallet $VERSION" \
            --notes-file release-body.md)
          {
            echo "## Draft release v$VERSION"
            echo ""
            echo "[$url]($url): review it, then **Publish release** to create the tag."
            echo ""
            echo "### Then upload to the stores"
            echo ""
            echo "**Chrome Web Store:** upload \`$CHROME_ZIP\` in the developer dashboard."
            echo ""
            echo "**addons.mozilla.org:** upload \`$XPI\` as a new version, attach \`$SOURCE_ZIP\` in the **source code** field, and paste \`.github/AMO_REVIEWER_NOTES.md\` into **Notes to Reviewers**. AMO requires the sources because the add-on ships bundled and minified code, and the archive has to be the one built alongside this xpi."
            echo ""
            echo "SHA-256 \`$SOURCE_ZIP\`: \`$SOURCE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
